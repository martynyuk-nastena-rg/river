<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style2.2.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>Вход или Регистрация</title>
    <link rel="icon" type="image/png" href="иконка2.jpg">
</head>
<body class="login-page">
    <div class="wrapper">
        <!-- Первая форма - добавьте класс form-login -->
        <form action="" class="form-login">
            <h1>Вход</h1>
            <div class="input-box">
                <i class='bx bx-user'></i>
                <input type="text" placeholder="Имя пользователя" required>
            </div>
            <div class="input-box">
                <i class='bx bx-lock-alt'></i>
                <input type="password" placeholder="Пароль" required>
            </div>
            <div class="remember">
                <label><input type="checkbox"> Запомнить меня</label>
                <a href="#">Забыли пароль?</a>
            </div>
            <button type="submit" class="btn"><a href="index2.html">Войти</a></button>        
            <div class="register-link">
                <!-- Добавьте класс register-btn к ссылке -->
                <p>Нет аккаунта?<a href="#" class="register-btn"> Регистрация</a></p>
            </div>
        </form>

        <!-- Вторая форма -->
        <form action="" class="form-register" style="display: none;">
            <h1>Регистрация</h1>
            <div class="input-box">
                <i class='bx bx-user'></i>
                <input type="text" placeholder="Имя пользователя" required>
            </div>
            <div class="input-box">
                <i class='bx bx-envelope'></i>
                <input type="email" placeholder="Email" required>
            </div>
            <div class="input-box">
                <i class='bx bx-lock-alt'></i>
                <input type="password" placeholder="Пароль" required>
            </div>
            <div class="input-box">
                <i class='bx bx-lock-alt'></i>
                <input type="password" placeholder="Повторите пароль" required>
            </div>
            <div class="remember">
                <label><input type="checkbox" required> Принимаю условия соглашения</label>
            </div>
            <button type="submit" class="btn"><a href="index2.html">Зарегистрироваться</a></button>
            <div class="register-link">
                <p>Уже есть аккаунт? <a href="#" class="login-btn">Войти</a></p>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerBtn = document.querySelector('.register-btn');
            const loginBtn = document.querySelector('.login-btn');
            const formLogin = document.querySelector('.form-login');
            const formRegister = document.querySelector('.form-register');

            console.log('Elements found:', {
                registerBtn: registerBtn,
                loginBtn: loginBtn,
                formLogin: formLogin,
                formRegister: formRegister
            });

            registerBtn.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Register button clicked');
                formLogin.style.display = 'none';
                formRegister.style.display = 'block';
            });

            loginBtn.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('Login button clicked');
                formRegister.style.display = 'none';
                formLogin.style.display = 'block';
            });
        });
    </script>
</body>
</html>
